<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Clientes & Cartera CRM</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="clients-content" [fullscreen]="true">
  <div class="clients-wrapper" role="main" id="main-content">
    <div class="section-bar">
      <div>
        <h1 class="page-title">Cartera de Clientes Corporativos</h1>
        <p class="page-subtitle">Reutilización de la tabla avanzada con ordenación y búsqueda reactiva sobre cuentas B2B.</p>
      </div>

      <div>
        <button type="button" class="btn-csv" (click)="exportCsv()" aria-label="Exportar cartera a CSV">
          📊 Exportar Cartera CSV
        </button>
      </div>
    </div>

    <div *ngIf="isLoading()" class="loading-state" role="status">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
      <p>Cargando cartera desde PostgreSQL relacional...</p>
    </div>

    <div *ngIf="!isLoading()">
      <app-advanced-data-table
        [columns]="columns"
        [data]="clients()"
        [pageSize]="5"
        tableTitle="Cartera de Clientes"
        [statusFilterOptions]="['ACTIVO', 'POTENCIAL', 'INACTIVO']"
        statusFilterKey="status">
      </app-advanced-data-table>
    </div>
  </div>
</ion-content>
